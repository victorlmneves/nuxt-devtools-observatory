# CI analysis. Automatic analysis cannot import coverage reports.
# Turn Automatic Analysis off under Administration > Analysis Method.
sonar.organization=victorlmneves
sonar.projectKey=victorlmneves_nuxt-devtools-observatory
sonar.sourceEncoding=UTF-8
sonar.exclusions=docs/public,docs/screenshots

# Produced by `pnpm test:coverage` (Vitest v8).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Unit coverage is collected for src/transforms, src/runtime, and src/nitro.
# plugin.ts needs a full Nuxt runtime and is omitted from that report.
sonar.coverage.exclusions=src/runtime/plugin.ts,src/module.ts,src/env-options.ts,src/types/**,client/**,playground/**,docs/**,tests/**,scripts/**,**/*.config.ts,**/*.config.js,**/*.config.mjs
