# Automatic analysis. These directories contain only PNG assets, which are not UTF-8 source.
sonar.sourceEncoding=UTF-8
sonar.exclusions=docs/public,docs/screenshots

# docs/tsconfig.json and playground/tsconfig.json extend a generated .nuxt/tsconfig.json.
sonar.typescript.tsconfigPaths=tsconfig.json,client/tsconfig.json,tests/verification/tsconfig.json
