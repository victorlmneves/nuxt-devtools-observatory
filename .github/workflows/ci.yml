name: CI

permissions:
    contents: read

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
    pull_request:
        branches:
            - main

jobs:
    quality:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a
              with:
                  version: 10.28.2

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint commit messages
              run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.sha }}" --verbose

            - name: Lint
              run: pnpm lint

            - name: Typecheck
              run: pnpm typecheck

            - name: Unit tests
              run: pnpm test

    e2e:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

            - name: Setup pnpm
              uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a
              with:
                  version: 10.28.2

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Playwright Chromium
              run: pnpm exec playwright install --with-deps chromium

            - name: Playground e2e
              run: pnpm test:e2e
              env:
                  CI: true
