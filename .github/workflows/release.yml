name: Release

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
    push:
        branches:
            - main

jobs:
    publish-and-release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.28.0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Setup npm for trusted publishing
              run: |
                  corepack enable npm
                  npm --version

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run tests
              run: pnpm test

            - name: Build package
              run: pnpm build

            - name: Validate trusted publishing context
              run: |
                  echo "event_name=${GITHUB_EVENT_NAME}"
                  echo "ref=${GITHUB_REF}"
                  echo "repository=${GITHUB_REPOSITORY}"
                  echo "workflow=${GITHUB_WORKFLOW}"
                  echo "npm_registry=$(npm config get registry)"

                  if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ] || [ -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
                    echo "Trusted Publishing OIDC context is not available in this run."
                    echo "Check npm Trusted Publisher mapping: owner/repo/workflow filename release.yml on branch main."
                    exit 1
                  fi

                  echo "OIDC context detected. semantic-release will publish to npm when there are releasable commits."

            - name: Release and publish to npm
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: pnpm exec semantic-release
